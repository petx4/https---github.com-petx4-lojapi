spring.application.name=lojapi

# ===== Banco de dados MySQL =====
# createDatabaseIfNotExist=true cria o banco "loja" sozinho na primeira execucao.
spring.datasource.url=jdbc:mysql://localhost:3306/loja?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
spring.datasource.username=root
spring.datasource.password=root

# ===== JPA / Hibernate =====
# update: cria/atualiza a tabela a partir da classe @Entity automaticamente.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== Servidor =====
server.port=8080
